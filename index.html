<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEXPLAY 👑 پایگاه گیمینگ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --طلایی: #FFD700;
            --طلایی-تیره: #B8860B;
            --بنفش: #6A0DAD;
            --بنفش-روشن: #9932CC;
            --مشکی: #050510;
            --تیره-متوسط: #12122A;
            --کارت: #1A1A3A;
            --سفید: #FFFFFF;
            --خاکستری: #AAAAAA;
            --سایه-طلایی: 0 0 20px rgba(255,215,0,0.4);
            --سایه-بنفش: 0 0 20px rgba(106,13,173,0.3);
        }
        * {margin:0; padding:0; box-sizing:border-box; font-family:'El Messiri', sans-serif;}
        body {
            background:var(--مشکی);
            color:var(--سفید);
            min-height:100vh;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(106,13,173,0.15) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(255,215,0,0.12) 0%, transparent 45%);
            background-attachment:fixed;
            transition:background 0.5s ease;
        }
        body.تم-روشن {
            --مشکی: #1A1A2E;
            --تیره-متوسط: #2A2A4E;
            --کارت: #252550;
        }
        .سربرگ {
            background:linear-gradient(180deg, rgba(26,26,58,0.95), rgba(5,5,16,0.9));
            padding:1.2rem 2rem;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:2px solid var(--طلایی);
            box-shadow:var(--سایه-طلایی);
            position:sticky;
            top:0;
            z-index:100;
        }
        .لوگو {
            font-size:2rem;
            font-weight:700;
            background:linear-gradient(90deg, var(--طلایی), var(--طلایی-تیره), var(--طلایی));
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            text-shadow:0 0 30px rgba(255,215,0,0.3);
            letter-spacing:1px;
        }
        .نوار {display:flex; gap:0.8rem; flex-wrap:wrap;}
        .تب {
            padding:0.7rem 1.4rem;
            border-radius:10px;
            cursor:pointer;
            transition:all 0.3s ease;
            border:2px solid transparent;
            font-weight:600;
        }
        .تب.فعال {
            border-color:var(--طلایی);
            background:linear-gradient(135deg, rgba(255,215,0,0.2), rgba(184,134,11,0.1));
            box-shadow:var(--سایه-طلایی);
        }
        .تب:hover {
            border-color:var(--بنفش-روشن);
            transform:translateY(-2px);
        }
        .دکمه-مدیریت {
            background:linear-gradient(135deg, var(--بنفش), var(--بنفش-روشن));
            padding:0.7rem 1.4rem;
            border-radius:10px;
            cursor:pointer;
            font-weight:700;
            border:none;
            color:white;
            transition:all 0.3s ease;
            box-shadow:var(--سایه-بنفش);
        }
        .دکمه-مدیریت:hover {transform:scale(1.05);}
        .محتوا {max-width:1200px; margin:2rem auto; padding:0 1rem;}
        .بخش {display:none; animation:ظاهر 0.5s ease;}
        .بخش.فعال {display:block;}
        @keyframes ظاهر {
            from{opacity:0; transform:translateY(15px);}
            to{opacity:1; transform:none;}
        }
        .عنوان-بخش {
            font-size:1.6rem;
            margin-bottom:1.5rem;
            color:var(--طلایی);
            border-bottom:1px solid rgba(255,215,0,0.2);
            padding-bottom:0.5rem;
        }
        .شبکه-کارت {
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));
            gap:1.5rem;
        }
        .کارت {
            background:var(--کارت);
            border-radius:14px;
            padding:1.5rem;
            border:1px solid rgba(255,215,0,0.15);
            transition:all 0.3s ease;
            position:relative;
            overflow:hidden;
        }
        .کارت::before {
            content:'';
            position:absolute;
            top:0; left:0; right:0;
            height:3px;
            background:linear-gradient(90deg, var(--طلایی), var(--بنفش), var(--طلایی));
        }
        .کارت:hover {
            transform:translateY(-6px);
            border-color:var(--طلایی);
            box-shadow:0 15px 40px rgba(255,215,0,0.15);
        }
        .کارت h3 {
            color:var(--طلایی);
            margin-bottom:0.6rem;
            font-size:1.25rem;
        }
        .کارت p {color:var(--خاکستری); margin-bottom:1rem; line-height:1.6;}
        .دکمه-لینک {
            display:inline-block;
            background:linear-gradient(135deg, var(--طلایی), var(--طلایی-تیره));
            color:black;
            padding:0.7rem 1.4rem;
            border-radius:8px;
            text-decoration:none;
            font-weight:700;
            transition:transform 0.2s ease;
        }
        .دکمه-لینک:hover {transform:scale(1.05);}
        .دکمه-حذف {
            background:rgba(255,50,50,0.2);
            color:#FF6666;
            border:none;
            padding:0.4rem 0.8rem;
            border-radius:6px;
            margin-right:0.5rem;
            cursor:pointer;
            font-size:0.9rem;
        }
        .فرم-پنل {
            background:var(--کارت);
            border-radius:16px;
            padding:2rem;
            max-width:600px;
            margin:0 auto;
            border:1px solid rgba(106,13,173,0.3);
            box-shadow:var(--سایه-بنفش);
        }
        .فرم-پنل h3 {
            color:var(--طلایی);
            margin-bottom:1.5rem;
            text-align:center;
        }
        .فرم-پنل input, .فرم-پنل textarea, .فرم-پنل select {
            width:100%;
            padding:0.9rem 1rem;
            margin:0.5rem 0 1rem;
            border:1px solid rgba(255,215,0,0.2);
            border-radius:10px;
            background:rgba(0,0,0,0.4);
            color:white;
            font-size:1rem;
        }
        .فرم-پنل input:focus, .فرم-پنl textarea:focus {
            outline:none;
            border-color:var(--طلایی);
            box-shadow:0 0 10px rgba(255,215,0,0.2);
        }
        .دکمه-اصلی {
            width:100%;
            padding:1rem;
            background:linear-gradient(135deg, var(--طلایی), var(--بنفش));
            border:none;
            border-radius:10px;
            color:white;
            font-size:1.1rem;
            font-weight:700;
            cursor:pointer;
            margin-top:0.5rem;
            transition:transform 0.2s ease;
        }
        .دکمه-اصلی:hover {transform:scale(1.02);}
        .دکمه-خروج {
            background:transparent;
            border:1px solid rgba(255,255,255,0.2);
            color:var(--خاکستری);
            padding:0.7rem 1.5rem;
            border-radius:8px;
            margin-top:1rem;
            cursor:pointer;
            width:100%;
        }
        .پنهان {display:none !important;}
        .خالی {text-align:center; color:var(--خاکستری); padding:4rem 2rem;}
        .تب-بخش {margin-bottom:1.5rem; display:flex; gap:0.5rem; flex-wrap:wrap;}
        .تب-فرعی {
            padding:0.6rem 1.2rem;
            background:transparent;
            border:1px solid rgba(255,215,0,0.2);
            color:var(--سفید);
            border-radius:8px;
            cursor:pointer;
        }
        .تب-فرعی.فعال {
            background:rgba(255,215,0,0.15);
            border-color:var(--طلایی);
        }
        .پاورقی {
            text-align:center;
            padding:2rem;
            margin-top:4rem;
            border-top:1px solid rgba(255,215,0,0.15);
            color:var(--خاکستری);
        }
        .گروه-رنگ {display:flex; gap:0.5rem; margin:1rem 0; flex-wrap:wrap;}
        .دکمه-رنگ {
            width:40px; height:40px;
            border-radius:50%;
            border:3px solid transparent;
            cursor:pointer;
        }
        .دکمه-رنگ.انتخاب {border-color:white; box-shadow:0 0 10px rgba(255,255,255,0.5);}
    </style>
</head>
<body>

<header class="سربرگ">
    <div class="لوگو">👑 VORTEXPLAY</div>
    <nav class="نوار" id="نواراصلی">
        <div class="تب فعال" data-bخش="بازی">بازی‌ها</div>
        <div class="تب" data-bخش="پیلود">پیلود</div>
        <div class="تب" data-bخش="بکاپ">بکاپ/آموزش</div>
    </nav>
    <button class="دکمه-مدیریت" onclick="بازکردن_پنل()">🔐 مدیریت</button>
</header>

<main class="محتوا">
    <!-- بخش بازی‌ها -->
    <div class="بخش فعال" id="بخش-بازی">
        <h2 class="عنوان-بخش">🎮 بازی‌ها</h2>
        <div class="شبکه-کارت" id="لیست-بازی"></div>
    </div>

    <!-- بخش پیلود -->
    <div class="بخش" id="بخش-پیلود">
        <h2 class="عنوان-بخش">📦 پیلود</h2>
        <div class="شبکه-کارت" id="لیست-پیلود"></div>
    </div>

    <!-- بخش بکاپ -->
    <div class="بخش" id="بخش-بکاپ">
        <h2 class="عنوان-بخش">💾 بکاپ/آموزش</h2>
        <div class="شبکه-کارت" id="لیست-بکاپ"></div>
    </div>

    <!-- پنل مدیریت -->
    <div class="بخش" id="بخش-مدیریت">
        <!-- فرم ورود -->
        <div id="فرم-ورود" class="فرم-پنل">
            <h3>🔐 ورود به پنل مدیریت</h3>
            <input type="password" id="رمز-ورود" placeholder="رمز ۳۲ رقمی را وارد کنید">
            <button class="دکمه-اصلی" onclick="بررسی_رمز()">ورود</button>
        </div>

        <!-- فرم مدیریت اصلی -->
        <div id="فرم-مدیریت" class="پنهان">
            <div class="تب-بخش">
                <button class="تب-فرعی فعال" data-فرم="محتوا">➕ افزودن محتوا</button>
                <button class="تب-فرعی" data-فرم="ویرایش">✏️ ویرایش/حذف</button>
                <button class="تب-فرعی" data-فرم="ظاهر">🎨 تغییر ظاهر سایت</button>
            </div>

            <!-- فرم افزودن محتوا -->
            <div id="فرم-محتوا" class="فرم-پنل">
                <h3>➕ محتوای جدید</h3>
                <select id="نوع-محتوا">
                    <option value="بازی">بازی‌ها</option>
                    <option value="پیلود">پیلود</option>
                    <option value="بکاپ">بکاپ/آموزش</option>
                </select>
                <input type="text" id="عنوان" placeholder="عنوان">
                <textarea id="توضیحات" rows="3" placeholder="توضیحات کوتاه"></textarea>
                <input type="url" id="لینک" placeholder="لینک دانلود">
                <button class="دکمه-اصلی" onclick="ثبت_محتوا()">✅ ثبت و نمایش</button>
            </div>

            <!-- فرم ویرایش/حذف -->
            <div id="فرم-ویرایش" class="فرم-پنل پنهان">
                <h3>✏️ ویرایش یا حذف</h3>
                <p style="color:var(--خاکستری); margin-bottom:1rem;">مورد مورد نظر را انتخاب کنید:</p>
                <select id="لیست-انتخاب" onchange="بارگذاری_مورد()">
                    <option value="">-- انتخاب کنید --</option>
                </select>
                <input type="text" id="ویرایش-عنوان" placeholder="عنوان جدید">
                <textarea id="ویرایش-توضیحات" rows="3" placeholder="توضیحات جدید"></textarea>
                <input type="url" id="ویرایش-لینک" placeholder="لینک جدید">
                <button class="دکمه-اصلی" onclick="ذخیره_ویرایش()">💾 ذخیره تغییرات</button>
                <button style="background:rgba(255,50,50,0.2); color:#FF6666; border:none; padding:0.8rem; border-radius:8px; margin-top:0.5rem; width:100%; cursor:pointer;" onclick="حذف_محتوا()">🗑️ حذف این مورد</button>
            </div>

            <!-- فرم تغییر ظاهر -->
            <div id="فرم-ظاهر" class="فرم-پنل پنهان">
                <h3>🎨 سفارشی‌سازی ظاهر</h3>
                <p style="color:var(--خاکستری); margin-bottom:1rem;">تم سایت را انتخاب کنید:</p>
                <div class="گروه-رنگ">
                    <button class="دکمه-رنگ انتخاب" style="background:linear-gradient(135deg,#050510,#1A1A3A);" onclick="تغییر_تم('تیره')" title="تم تیره سلطنتی"></button>
                    <button class="دکمه-رنگ" style="background:linear-gradient(135deg,#1A1A2E,#2A2A5E);" onclick="تغییر_تم('متوسط')" title="تم متوسط"></button>
                    <button class="دکمه-رنگ" style="background:linear-gradient(135deg,#252550,#3A3A70);" onclick="تغییر_تم('روشن')" title="تم روشن"></button>
                </div>
                <p style="color:var(--خاکستری); margin:1.5rem 0 0.5rem;">نام سایت:</p>
                <input type="text" id="نام-سایت" placeholder="VORTEXPLAY" oninput="تغییر_نام()">
            </div>

            <button class="دکمه-خروج" onclick="خروج_مدیریت()">خروج از پنل مدیریت</button>
        </div>
    </div>
</main>

<footer class="پاورقی">
    <p>VORTEXPLAY © 2026 | همه حقوق محفوظ است</p>
</footer>

<script>
// ===== اتصال دیتابیس =====
const SUPABASE_URL = "https://ysovsscszmytalyrodeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_4OxYjCjqv5vxo2u6Ck03sg_ziAjqVGO";
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== رمز مدیریت ۳۲ رقمی =====
const رمز_مدیریت = "VORTEX-992383-SHAHRIAR-2026-PLAY";
let دسترسی_داده = false;
let ویرایش_شناسه = null;

// ===== تعویض تب‌های اصلی =====
document.querySelectorAll("#نواراصلی .تب").forEach(تب => {
    تب.addEventListener("click", () => {
        document.querySelectorAll("#نواراصلی .تب").forEach(t => t.classList.remove("فعال"));
        تب.classList.add("فعال");
        const نام = تب.getAttribute("data-bخش");
        document.querySelectorAll(".بخش").forEach(b => b.classList.remove("فعال"));
        document.getElementById(`بخش-${نام}`).classList.add("فعال");
    });
});

// ===== تعویض تب‌های فرعی پنل =====
document.querySelectorAll(".تب-فرعی").forEach(تب => {
    تب.addEventListener("click", () => {
        document.querySelectorAll(".تب-فرعی").forEach(t => t.classList.remove("فعال"));
        تب.classList.add("فعال");
        const نام = تب.getAttribute("data-فرم");
        document.querySelectorAll("[id^='فرم-']").forEach(f => {
            if (f.id.startsWith("فرم-") && !f.id.includes("ورود") && !f.id.includes("مدیریت")) {
                f.classList.add("پنهان");
            }
        });
        document.getElementById(`فرم-${نام}`).classList.remove("پنهان");
        if (نام === "ویرایش") بارگذاری_لیست_انتخاب();
    });
});

function بازکردن_پنل() {
    document.querySelectorAll("#نواراصلی .تب").forEach(t => t.classList.remove("فعال"));
    document.querySelectorAll(".بخش").forEach(b => b.classList.remove("فعال"));
    document.getElementById("بخش-مدیریت").classList.add("فعال");
    if (دسترسی_داده) {
        document.getElementById("فرم-ورود").classList.add("پنهان");
        document.getElementById("فرم-مدیریت").classList.remove("پنهان");
    }
}

function بررسی_رمز() {
    const ورودی = document.getElementById("رمز-ورود").value.trim();
    if (ورودی === رمز_مدیریت) {
        دسترسی_داده = true;
        document.getElementById("فرم-ورود").classList.add("پنهان");
        document.getElementById("فرم-مدیریت").classList.remove("پنهان");
        بارگذاری_همه();
    } else {
        alert("❌ رمز عبور اشتباه است!");
    }
}

function خروج_مدیریت() {
    دسترسی_داده = false;
    ویرایش_شناسه = null;
    document.getElementById("فرم-ورود").classList.remove("پنهان");
    document.getElementById("فرم-مدیریت").classList.add("پنهان");
    document.getElementById("رمز-ورود").value = "";
}

// ===== بارگذاری همه محتوا =====
async function بارگذاری_همه() {
    const { data, error } = await supabase
        .from("محتوا")
        .select("*")
        .order("ایجاد_شده", { ascending: false });

    if (error) {
        console.error("خطا:", error);
        return;
    }

    ["بازی", "پیلود", "بکاپ"].forEach(نوع => {
        const کانتینر = document.getElementById(`لیست-${نوع}`);
        const موارد = data.filter(m => m.نوع === نوع);
        if (موارد.length === 0) {
            کانتینر.innerHTML = `<p class="خالی">هنوز محتوایی اضافه نشده است</p>`;
        } else {
            کانتینر.innerHTML = موارد.map(ساخت_کارت).join("");
        }
    });
}

function ساخت_کارت(مورد) {
    return `
        <div class="کارت">
            <h3>${مورد.عنوان}</h3>
            <p>${مورد.توضیحات || "بدون توضیح"}</p>
            <a href="${مورد.لینک}" target="_blank" class="دکمه-لینک">⬇️ دانلود</a>
        </div>
    `;
}

// ===== ثبت محتوای جدید =====
async function ثبت_محتوا() {
    const نوع = document.getElementById("نوع-محتوا").value;
    const عنوان = document.getElementById("عنوان").value.trim();
    const توضیحات = document.getElementById("توضیحات").value.trim();
    const لینک = document.getElementById("لینک").value.trim();

    if (!عنوان || !لینک) {
        alert("لطفاً عنوان و لینک را کامل کنید!");
        return;
    }

    const { error } = await supabase.from("محتوا").insert([{
        نوع, عنوان, توضیحات, لینک
    }]);

    if (error) {
        alert("❌ خطا: " + error.message + "\n\nاولین بار باید جدول در ساپابیس ساخته شود. به من بگو تا دستورش را بدهم!");
    } else {
        alert("✅ با موفقیت اضافه شد! همه می‌بینند");
        document.getElementById("عنوان").value = "";
        document.getElementById("توضیحات").value = "";
        document.getElementById("لینک").value = "";
        await بارگذاری_همه();
    }
}

// ===== بارگذاری لیست برای ویرایش =====
async function بارگذاری_لیست_انتخاب() {
    const { data, error } = await supabase.from("محتوا").select("*").order("ایجاد_شده", { ascending: false });
    if (error) return;
    
    const لیست = document.getElementById("لیست-انتخاب");
    لیست.innerHTML = `<option value="">-- انتخاب کنید --</option>`;
    data.forEach(m => {
        لیست.innerHTML += `<option value="${m.id}">${m.نوع} — ${m.عنوان}</option>`;
    });
}

async function بارگذاری_مورد() {
    const شناسه = document.getElementById("لیست-انتخاب").value;
    if (!شناسه) {
        ویرایش_شناسه = null;
        return;
    }
    ویرایش_شناسه = شناسه;
    
    const { data } = await supabase.from("محتوا").select("*").eq("id", شناسه).single();
    if (data) {
        document.getElementById("ویرایش-عنوان").value = data.عنوان || "";
        document.getElementById("ویرایش-توضیحات").value = data.توضیحات || "";
        document.getElementById("ویرایش-لینک").value = data.لینک || "";
    }
}

async function ذخیره_ویرایش() {
    if (!ویرایش_شناسه) {
        alert("ابتدا یک مورد را انتخاب کنید!");
        return;
    }

    const عنوان = document.getElementById("ویرایش-عنوان").value.trim();
    const توضیحات = document.getElementById("ویرایش-توضیحات").value.trim();
    const لینک = document.getElementById("ویرایش-لینک").value.trim();

    if (!عنوان || !لینک) {
        alert("عنوان و لینک نمی‌توانند خالی باشند!");
        return;
    }

    const { error } = await supabase.from("محتوا")
        .update({ عنوان, توضیحات, لینک })
        .eq("id", ویرایش_شناسه);

    if (error) {
        alert("❌ خطا: " + error.message);
    } else {
        alert("✅ با موفقیت ویرایش شد!");
        await بارگذاری_همه();
        await بارگذاری_لیست_انتخاب();
    }
}

async function حذف_محتوا() {
    if (!ویرایش_شناسه) {
        alert("ابتدا یک مورد را انتخاب کنید!");
        return;
    }
    if (!confirm("آیا مطمئن هستید که حذف شود؟")) return;

    const { error } = await supabase.from("محتوا")
        .delete()
        .eq("id", ویرایش_شناسه);

    if (error) {
        alert("❌ خطا: " + error.message);
    } else {
        alert("✅ با موفقیت حذف شد!");
        ویرایش_شناسه = null;
        await بارگذاری_همه();
        await بارگذاری_لیست_انتخاب();
    }
}
