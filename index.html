    <script>
        // تنظیمات دیتابیس آنلاین شما
        const BIN_ID = '6ab5bbe7ac6210605af2b3d8';
        const MASTER_KEY = '$2a$10$usLohOFjd/ytmzsresklbOlovg8YK7KKOL.E3BXVQ8hDCwG86FLf2';
        const BASE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        let currentProducts = [];

        // نمایش/مخفی‌سازی پنل مدیریت
        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        }

        // دریافت محصولات از دیتابیس آنلاین (بدون کاش مرورگر)
        async function fetchProducts() {
            try {
                // اضافه کردن تایم‌استمپ برای شکستن کاش مرورگر در سیستم‌ها و مرورگرهای مختلف
                const nocacheUrl = `${BASE_URL}/latest?t=${new Date().getTime()}`;
                const res = await fetch(nocacheUrl, {
                    headers: { 
                        'X-Master-Key': MASTER_KEY,
                        'Cache-Control': 'no-cache'
                    }
                });
                const data = await res.json();
                currentProducts = data.record.products || [];
                renderProducts();
            } catch (err) {
                console.error(err);
                alert('خطا در دریافت اطلاعات از دیتابیس!');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('productGrid').style.display = 'flex';
            }
        }

        // رندر کردن کارت‌های محصولات
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (currentProducts.length === 0) {
                grid.innerHTML = '<div class="col-12 text-center text-muted py-5">هنوز هیچ محصولی اضافه نشده است.</div>';
                return;
            }

            currentProducts.forEach((p, index) => {
                grid.innerHTML += `
                    <div class="col-md-4 col-sm-6">
                        <div class="product-card h-100 d-flex flex-column">
                            <img src="${p.img}" class="product-img" alt="${p.title}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
                            <div class="card-body d-flex flex-column justify-content-between p-3">
                                <div>
                                    <span class="badge bg-secondary mb-2">${p.cat}</span>
                                    <h5 class="card-title text-white mb-2">${p.title}</h5>
                                    <p class="gold-text fs-5 mb-3">${p.price} تومان</p>
                                </div>
                                <div class="d-flex gap-2">
                                    <a href="${p.link}" target="_blank" class="btn gold-btn w-100">
                                        <i class="fa-solid fa-cart-shopping me-1"></i> خرید
                                    </a>
                                    <button onclick="deleteProduct(${index})" class="btn btn-outline-danger btn-sm" title="حذف">
                                        <i class="fa-solid fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // افزودن محصول جدید
        async function handleAddProduct(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'در حال ذخیره‌سازی...';

            const newProduct = {
                title: document.getElementById('pTitle').value,
                price: document.getElementById('pPrice').value,
                cat: document.getElementById('pCat').value,
                img: document.getElementById('pImg').value,
                link: document.getElementById('pLink').value
            };

            currentProducts.push(newProduct);

            try {
                await updateDatabase();
                document.getElementById('addProductForm').reset();
                toggleAdminPanel();
                renderProducts();
                alert('محصول با موفقیت در دیتابیس ابری ثبت شد!');
            } catch (err) {
                console.error(err);
                alert('خطا در ذخیره‌سازی محصول!');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-1"></i> ثبت و انتشار آنلاین';
            }
        }

        // حذف محصول
        async function deleteProduct(index) {
            if (confirm('آیا از حذف این محصول اطمینان دارید؟')) {
                currentProducts.splice(index, 1);
                renderProducts();
                await updateDatabase();
            }
        }

        // آپدیت ابری دیتابیس
        async function updateDatabase() {
            const res = await fetch(BASE_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY,
                    'X-Bin-Versioning': 'false'
                },
                body: JSON.stringify({ products: currentProducts })
            });

            if (!res.ok) {
                throw new Error('خطا در ثبت در دیتابیس');
            }
        }

        // شروع برنامه
        fetchProducts();
    </script>
